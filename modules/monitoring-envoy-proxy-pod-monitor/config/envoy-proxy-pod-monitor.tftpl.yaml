apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-proxy-pod-monitor
  namespace: ${namespace}
spec:
  namespaceSelector:
    matchNames:
      - ${namespace}
  podMetricsEndpoints:
    - path: /stats/prometheus
      port: metrics
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy
